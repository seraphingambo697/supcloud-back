# nginx.conf

map $http_accept $files_is_page {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5g;

    proxy_redirect ~^https?://[^/]+(/.*)$ $1;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache assets statiques
    location ~* \.(js|css|png|jpg|svg|woff2|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Auth
    location /auth/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host gateway:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Date;
        proxy_hide_header Server;
    }

    # GET /files : API (Axios) 
    location = /files {
        if ($files_is_page) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://gateway:8000;
        proxy_set_header Host gateway:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Date;
        proxy_hide_header Server;
    }

    # Fichiers 
    location /files/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host gateway:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_hide_header Date;
        proxy_hide_header Server;
    }

    # Partage
    location = /share/links {
        proxy_pass http://gateway:8000;
        proxy_set_header Host gateway:8000;
    }
    location /share/links/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host gateway:8000;
    }
    location /share/resolve/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host gateway:8000;
    }
    location /share/internal {
        proxy_pass http://gateway:8000;
        proxy_set_header Host gateway:8000;
    }
    location /share/with-me {
        proxy_pass http://gateway:8000;
        proxy_set_header Host gateway:8000;
    }

    # Téléchargement 
    location ~ ^/share/[^/]+/(download|zip)$ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host gateway:8000;
        proxy_read_timeout 600s;
    }

    # Routes React 
    location / {
        try_files $uri $uri/ /index.html;
    }
}